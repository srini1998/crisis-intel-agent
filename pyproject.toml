[project]
name = "crisis-intel-agent"
version = "0.1.0"
description = "Live multi-source disaster monitoring with retrieval-grounded, machine-verified situation reports from a local model"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "numpy>=2.0"]

[project.scripts]
crisis = "crisis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "crisis"
