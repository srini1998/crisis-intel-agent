name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest -q
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # CPU wheels keep the job small; the engine has no GPU code path
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv run --no-sync pytest -q tests/test_engine.py
